<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABTalks AI Interview Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">

        <button class="new-chat" onclick="startInterview()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            New interview
        </button>

        <div class="candidate-picker">
            <label for="candidate-select">Candidate</label>
            <select id="candidate-select"></select>
        </div>

        <nav class="history">
            <div class="history-label">Conversations</div>
            <a class="history-item active">
                <span class="dot"></span>
                Engineering interview
            </a>
            <a class="history-item">
                <span class="dot"></span>
                Follow-up session
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="avatar avatar-brand">A</div>
            <div class="user-meta">
                <div class="user-name">ABTalks Agent</div>
                <div class="user-role">AI Interviewer</div>
            </div>
        </div>

    </aside>

    <main class="main">

        <header class="topbar">
            <div class="topbar-left">
                <div class="avatar avatar-ai">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/>
                    </svg>
                </div>
                <div>
                    <div class="topbar-title">AI Interview Agent</div>
                    <div class="topbar-sub">
                        <span class="status-dot"></span> Interview in progress
                    </div>
                </div>
            </div>
            <div id="progress" class="progress-chip">Question 1 / 8</div>
        </header>

        <div class="conversation-wrap">
            <div id="chat" class="chat"></div>
        </div>

        <div class="composer-wrap">
            <div class="composer">
                <textarea
                    id="answer"
                    placeholder="Type your answer..."
                ></textarea>
                <button id="send-btn" onclick="sendAnswer()" aria-label="Send">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
            <div class="composer-hint">
                Shift + Enter to add a new line
            </div>
        </div>

    </main>

</div>

<script src="app.js"></script>

</body>
</html>
