<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABTalks AI Interview Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">

        <button class="new-chat" onclick="startInterview()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            New interview
        </button>

        <div class="candidate-picker">
            <label for="candidate-select">Candidate</label>
            <select id="candidate-select"></select>
        </div>

        <nav class="history">
            <div class="history-label">Conversations</div>
            <a class="history-item active">
                <span class="dot"></span>
                Engineering interview
            </a>
            <a class="history-item">
                <span class="dot"></span>
                Follow-up session
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="avatar avatar-brand">A</div>
            <div class="user-meta">
                <div class="user-name">ABTalks Agent</div>
                <div class="user-role">AI Interviewer</div>
            </div>
        </div>

    </aside>

    <main class="main">

        <header class="topbar">
            <div class="topbar-left">
                <div class="avatar avatar-ai">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/>
                    </svg>
                </div>
                <div>
                    <div class="topbar-title">AI Interview Agent</div>
                    <div class="topbar-sub">
                        <span class="status-dot"></span> Interview in progress
                    </div>
                </div>
            </div>
            <div id="progress" class="progress-chip">Question 1 / 8</div>
        </header>

        <div class="conversation-wrap">
            <div id="chat" class="chat"></div>
        </div>

        <div class="composer-wrap">
            <div class="composer">
                <textarea
                    id="answer"
                    placeholder="Type your answer..."
                ></textarea>
                <button id="send-btn" onclick="sendAnswer()" aria-label="Send">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
            <div class="composer-hint">
                Shift + Enter to add a new line
            </div>
        </div>

    </main>

</div>

<div id="intro" class="intro" hidden>
    <div class="intro-backdrop"></div>
    <div class="intro-stage">
        <div id="shay-avatar" class="intro-avatar">
            <svg viewBox="0 0 240 240" fill="none" aria-hidden="true">
                <defs>
                    <linearGradient id="shayBg" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#7c3aed"/>
                        <stop offset="100%" stop-color="#4f7cff"/>
                    </linearGradient>
                </defs>
                <circle cx="120" cy="120" r="120" fill="url(#shayBg)"/>
                <path d="M40 240 L40 210 Q40 182 72 180 L104 180 L108 188 L132 188 L136 180 L168 180 Q200 182 200 210 L200 240 Z" fill="#efe6ff"/>
                <rect x="108" y="150" width="24" height="50" rx="10" fill="#eab58f"/>
                <path d="M120 18 C60 18 38 70 42 128 C45 160 50 186 60 206 L70 192 C63 165 60 150 62 130 C66 92 84 56 120 54 C156 56 174 92 178 130 C180 150 177 165 170 192 L180 206 C190 186 195 160 198 128 C202 70 180 18 120 18 Z" fill="#3a2a20"/>
                <circle cx="120" cy="104" r="56" fill="#f6c9a9"/>
                <path d="M64 74 C66 44 90 34 120 34 C150 34 174 44 176 74 C170 82 162 74 156 84 C151 74 142 78 136 88 C130 76 118 80 112 92 C105 80 92 82 86 94 C78 82 71 84 64 74 Z" fill="#3a2a20"/>
                <ellipse cx="100" cy="116" rx="7.5" ry="9" fill="#2a1a10"/>
                <ellipse cx="140" cy="116" rx="7.5" ry="9" fill="#2a1a10"/>
                <circle cx="102" cy="112" r="2.6" fill="#fff"/>
                <circle cx="142" cy="112" r="2.6" fill="#fff"/>
                <path d="M92 102 Q100 98 108 102" stroke="#3a2a20" stroke-width="3" stroke-linecap="round"/>
                <path d="M132 102 Q140 98 148 102" stroke="#3a2a20" stroke-width="3" stroke-linecap="round"/>
                <ellipse cx="87" cy="130" rx="7" ry="4" fill="#f7a8b0" opacity="0.6"/>
                <ellipse cx="153" cy="130" rx="7" ry="4" fill="#f7a8b0" opacity="0.6"/>
                <path d="M108 132 Q120 146 132 132" stroke="#a13a2c" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            </svg>
        </div>
        <div id="intro-bubble" class="intro-bubble">
            <span id="intro-text"></span>
        </div>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
