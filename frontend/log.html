<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Usage Log · ABTalks Agent</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="log.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">

        <a class="new-chat" href="/">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            Chatbot interview
        </a>

        <a class="new-chat voice-nav" href="/voice.html">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="2" width="6" height="12" rx="3"/>
                <path d="M5 10v1a7 7 0 0 0 14 0v-1"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
            </svg>
            Voice interview
        </a>

        <a class="new-chat voice-nav active-log" href="/log.html">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <path d="M14 2v6h6"/>
                <path d="M8 13h8M8 17h5"/>
            </svg>
            AI Usage Log
        </a>

        <div class="sidebar-footer">
            <div class="avatar avatar-brand">A</div>
            <div class="user-meta">
                <div class="user-name">ABTalks Agent</div>
                <div class="user-role">AI Interviewer</div>
            </div>
            <a class="download-btn" href="/api/log/download" title="Download PROMPT.md as AI_Usage_Log.txt">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <path d="M7 10l5 5 5-5"/>
                    <path d="M12 15V3"/>
                </svg>
            </a>
        </div>

    </aside>

    <main class="main">

        <header class="topbar">
            <div class="topbar-left">
                <div class="avatar avatar-ai">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <path d="M14 2v6h6"/>
                        <path d="M8 13h8M8 17h5"/>
                    </svg>
                </div>
                <div>
                    <div class="topbar-title">AI Usage Log</div>
                    <div class="topbar-sub" id="log-sub">Loading…</div>
                </div>
            </div>
            <div class="topbar-actions">
                <button class="import-toggle" id="import-toggle" onclick="toggleImport()">+ Import chat</button>
            </div>
        </header>

        <div class="log-scroll">

            <div class="stats-row" id="stats-row"></div>

            <div class="filter-row">
                <button class="filter-chip active" data-filter="all" onclick="setFilter(this)">All</button>
                <button class="filter-chip" data-filter="sessions" onclick="setFilter(this)">Interviews</button>
                <button class="filter-chip" data-filter="llm_calls" onclick="setFilter(this)">LLM calls</button>
                <button class="filter-chip" data-filter="external_chats" onclick="setFilter(this)">Copilot imports</button>
                <button class="filter-chip" data-filter="attachments" onclick="setFilter(this)">Documents</button>
            </div>

            <div id="records" class="log-records"></div>

        </div>

    </main>

</div>

<div id="import-panel" class="import-panel" hidden>
    <div class="import-backdrop" onclick="toggleImport(false)"></div>
    <div class="import-stage">
        <button class="scoreboard-close" onclick="toggleImport(false)" aria-label="Close">×</button>
        <h2 class="candidate-title">Import an AI chat</h2>
        <p class="candidate-sub">Paste a Microsoft Copilot (or other AI) conversation — as text or JSON — and it will be added to the AI Usage Log.</p>
        <input id="import-title" class="import-title" type="text" placeholder="Title / topic (optional)">
        <textarea id="import-text" class="import-text" placeholder='Paste here. Text example:

You: How do I build a RAG pipeline?
Copilot: Start with a vector database...

Or JSON:
[{"role":"user","content":"..."},{"role":"assistant","content":"..."}]'></textarea>
        <div id="import-status" class="import-status"></div>
        <button class="import-submit" onclick="submitImport()">Add to log</button>
    </div>
</div>

<script src="log.js"></script>
</body>
</html>
